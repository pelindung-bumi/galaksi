apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payment-gateway-redpanda
spec:
  replicas: 1
  serviceName: payment-gateway-redpanda-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v26.1.5
          imagePullPolicy: Always
          args:
            - redpanda
            - start
            - --smp
            - "1"
            - --memory
            - 512M
            - --reserve-memory
            - 0M
            - --overprovisioned
            - --node-id
            - "0"
            - --kafka-addr
            - internal://0.0.0.0:9092
            - --advertise-kafka-addr
            - internal://payment-gateway-redpanda-0.payment-gateway-redpanda-headless.payment-gateway.svc.cluster.local:9092
            - --rpc-addr
            - internal://0.0.0.0:33145
            - --advertise-rpc-addr
            - internal://payment-gateway-redpanda-0.payment-gateway-redpanda-headless.payment-gateway.svc.cluster.local:33145
            - --check=false
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
            - name: rpc
              containerPort: 33145
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: 9644
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: 9644
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 256m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - name: datadir
              mountPath: /var/lib/redpanda/data
  volumeClaimTemplates:
    - metadata:
        name: datadir
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
